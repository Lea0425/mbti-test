<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBTI 性格测评 · 交互原型</title>
<style>
:root{
  --c-bg:#F0F2F8; --c-ink:#221E35; --c-sub:#6E7284; --c-line:#E7E8F0;
  --c-primary:#6366F1; --c-violet:#8B5CF6; --c-pink:#EC4899; --c-amber:#D97706;
  --grad:linear-gradient(135deg,#6366F1,#8B5CF6 55%,#EC4899);
  --shadow-card:0 8px 28px rgba(70,60,140,.08);
  --proto-bg:#1E1B3A; --proto-panel:#26223F; --proto-border:#3A3658;
  --proto-text:#B8BAD0; --proto-text-bright:#E8E2F8; --proto-accent:#818CF8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;user-select:none}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--proto-bg);color:var(--proto-text-bright);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
}

/* ====== Prototype Header ====== */
.proto-header{
  flex:none;height:56px;background:var(--proto-panel);
  border-bottom:1px solid var(--proto-border);
  display:flex;align-items:center;padding:0 24px;gap:16px;
}
.proto-logo{display:flex;align-items:center;gap:10px}
.proto-logo svg{flex:none}
.proto-title{font-size:15px;font-weight:700;color:var(--proto-text-bright)}
.proto-sub{font-size:12px;color:var(--proto-text);margin-left:8px}
.proto-header-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.proto-toggle{
  display:flex;align-items:center;gap:8px;background:var(--proto-border);
  border:none;border-radius:99px;padding:7px 14px;color:var(--proto-text-bright);
  font-size:13px;font-weight:600;cursor:pointer;transition:background .2s;
}
.proto-toggle:hover{background:#4A4670}
.proto-toggle.active{background:var(--c-primary);color:#fff}
.proto-badge{font-size:11px;color:var(--proto-text);background:var(--proto-border);padding:4px 10px;border-radius:6px;font-weight:600}

/* ====== Main Layout ====== */
.proto-layout{flex:1;display:flex;overflow:hidden}

/* ====== Left: Flow Nav ====== */
.proto-nav{
  flex:none;width:240px;background:var(--proto-panel);
  border-right:1px solid var(--proto-border);
  padding:20px 0;overflow-y:auto;
}
.nav-section-title{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--proto-text);text-transform:uppercase;padding:0 20px;margin-bottom:12px}
.nav-flow{display:flex;flex-direction:column;gap:4px;padding:0 12px}
.nav-step{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  cursor:pointer;transition:background .15s;position:relative;
}
.nav-step:hover{background:var(--proto-border)}
.nav-step.active{background:rgba(99,102,241,.18)}
.nav-step.active .nav-dot{box-shadow:0 0 0 3px rgba(99,102,241,.25)}
.nav-dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--proto-border);transition:all .2s}
.nav-step.active .nav-dot{background:var(--proto-accent)}
.nav-step.done .nav-dot{background:#22C55E}
.nav-step-label{font-size:13px;font-weight:500;color:var(--proto-text-bright)}
.nav-step.active .nav-step-label{color:var(--proto-accent)}
.nav-step-fr{font-size:10px;color:var(--proto-text);margin-left:auto;font-weight:600}
.nav-arrow{position:absolute;right:-10px;top:50%;transform:translateY(-50%);color:var(--proto-border);font-size:10px;z-index:1}
.nav-quick{padding:16px 20px;border-top:1px solid var(--proto-border);margin-top:12px}
.quick-btn{
  display:block;width:100%;background:var(--proto-border);border:none;border-radius:8px;
  padding:9px 12px;color:var(--proto-text-bright);font-size:12.5px;font-weight:600;
  cursor:pointer;transition:background .15s;margin-bottom:6px;
}
.quick-btn:hover{background:#4A4670}

/* ====== Center: Phone Frame ====== */
.phone-area{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.phone-frame{
  position:relative;width:380px;height:760px;background:#1a1a2e;border-radius:42px;
  padding:12px;box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 0 2px #333355;
  flex:none;
}
.phone-notch{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  width:120px;height:28px;background:#1a1a2e;border-radius:0 0 16px 16px;z-index:10;
}
.phone-screen{
  width:100%;height:100%;background:var(--c-bg);border-radius:32px;
  overflow:hidden;position:relative;
}
.phone-screen iframe{width:100%;height:100%;border:none;border-radius:32px}

/* annotation badges */
.anno-badge{
  position:absolute;background:var(--c-primary);color:#fff;font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:6px;z-index:20;white-space:nowrap;
  box-shadow:0 4px 12px rgba(99,102,241,.4);pointer-events:none;
  opacity:0;transition:opacity .2s;
}
.anno-badge.visible{opacity:1}
.anno-badge::after{
  content:'';position:absolute;width:0;height:0;
  border:5px solid transparent;
}
.anno-badge.arrow-left::after{border-right-color:var(--c-primary);right:100%;top:50%;transform:translateY(-50%)}
.anno-badge.arrow-right::after{border-left-color:var(--c-primary);left:100%;top:50%;transform:translateY(-50%)}
.anno-badge.arrow-up::after{border-bottom-color:var(--c-primary);bottom:100%;left:50%;transform:translateX(-50%)}

/* ====== Right: Annotation Panel ====== */
.anno-panel{
  flex:none;width:300px;background:var(--proto-panel);
  border-left:1px solid var(--proto-border);
  padding:20px;overflow-y:auto;
}
.anno-card{background:var(--proto-bg);border-radius:14px;padding:16px;margin-bottom:14px}
.anno-card-title{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--proto-text);text-transform:uppercase;margin-bottom:10px}
.anno-screen-name{font-size:18px;font-weight:700;color:var(--proto-text-bright);margin-bottom:4px}
.anno-screen-fr{display:inline-block;font-size:11px;font-weight:700;background:rgba(99,102,241,.2);color:var(--proto-accent);padding:3px 10px;border-radius:6px;margin-bottom:12px}
.anno-desc{font-size:13px;line-height:1.7;color:var(--proto-text)}
.anno-elements{list-style:none;padding:0;margin:0}
.anno-elements li{
  font-size:12.5px;line-height:1.6;color:var(--proto-text-bright);
  padding:7px 0 7px 18px;position:relative;border-bottom:1px solid rgba(255,255,255,.05);
}
.anno-elements li:last-child{border-bottom:none}
.anno-elements li::before{
  content:'';position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:50%;
}
.anno-elements li.green::before{background:#22C55E}
.anno-elements li.blue::before{background:var(--proto-accent)}
.anno-elements li.amber::before{background:#FBBF24}
.anno-interaction{
  font-size:12px;line-height:1.65;color:var(--proto-text);
  padding:10px 12px;background:rgba(129,140,248,.08);border-radius:8px;border-left:3px solid var(--proto-accent);
}
.anno-flow-mini{display:flex;flex-direction:column;gap:8px}
.anno-flow-step{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--proto-text)}
.anno-flow-step .dot{width:8px;height:8px;border-radius:50%;background:var(--proto-border);flex:none}
.anno-flow-step.current .dot{background:var(--proto-accent)}
.anno-flow-step.done .dot{background:#22C55E}
.anno-flow-arrow{color:var(--proto-border);font-size:10px;padding-left:16px}
</style>
</head>
<body>

<!-- ====== Prototype Header ====== -->
<div class="proto-header">

    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="url(#g1)"/><defs><linearGradient id="g1" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#6366F1"/><stop offset="1" stop-color="#EC4899"/></linearGradient></defs><path d="M8 14.5l3 3 5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>

      </div>

      <button class="quick-btn" onclick="resetProto()">重置原型</button>

  <!-- ====== Center: Phone Frame ====== -->
  <div class="phone-area">
    <div class="phone-frame">

</div>

<script>
'use strict';

var SCALE=[
  {label:'非常同意',value:2,dots:2,tone:'agree'},

];

];
var RAW_QUESTIONS={
EI:[{t:'在聚会或活动中认识新朋友，会让我感到充满活力。',r:1},{t:'长时间独处之后，我会特别想找人聊聊天。',r:1},{t:'周末我更愿意待在家里恢复精力，而不是出门见人。',r:-1},{t:'在小组讨论中，我习惯先听别人说完，再表达自己的想法。',r:-1},{t:'我能比较自然地和刚认识的人打开话题。',r:1},{t:'参加完一整天社交活动后，我常常感觉被「掏空」了。',r:-1},{t:'成为一群人关注的焦点，对我来说挺自在的。',r:1},{t:'遇到问题时，我更倾向于先自己想清楚，而不是马上找人讨论。',r:-1},{t:'比起文字，我口头表达往往更流畅、更有感染力。',r:1},{t:'一个人独处的时候，我很少觉得无聊或孤单。',r:-1}],
SN:[{t:'我更关注眼前的事实和细节，而不是遥远的可能性。',r:1},{t:'我常常会突然冒出一些和当前话题无关的奇思妙想。',r:-1},{t:'学习新事物时，我喜欢从具体的步骤和操作入手。',r:1},{t:'我喜欢用比喻和联想来解释一件事情。',r:-1},{t:'做事讲究按部就班、脚踏实地，这很符合我的风格。',r:1},{t:'我经常琢磨事物背后的含义和规律。',r:-1},{t:'看书或看电影时，我很在意细节是否真实、合理。',r:1},{t:'身边人常评价我「想法多、脑洞大」。',r:-1},{t:'我更相信亲身经验，而不是一闪而过的直觉。',r:1},{t:'我对未来总有很多想象和规划。',r:-1}],
TF:[{t:'做决定时，我更看重逻辑是否站得住脚，而不是别人的感受。',r:1},{t:'看到别人难过，我会本能地想去安慰对方。',r:-1},{t:'发现朋友方案里的漏洞，我通常直接指出来，不太绕弯子。',r:1},{t:'做决定时，我会特别在意这件事对身边人的影响。',r:-1},{t:'我认为客观公正比照顾情面更重要。',r:1},{t:'我很容易被电影或故事里的情感打动。',r:-1},{t:'争论问题时，我关注的是论据是否成立，而不是气氛是否尴尬。',r:1},{t:'朋友向我倾诉时，我的第一反应是理解他的情绪，而不是急着给方案。',r:-1},{t:'我习惯用「合不合理、值不值」来评估一件事。',r:1},{t:'维护身边的和谐氛围，对我来说很重要。',r:-1}],
JP:[{t:'我喜欢提前把计划安排好，再按计划行事。',r:1},{t:'我常常把事情拖到最后一刻才完成。',r:-1},{t:'我的桌面或房间通常保持整洁有序。',r:1},{t:'出去旅行时，我更喜欢随心所欲，走到哪玩到哪。',r:-1},{t:'事情悬而未决，会让我感到不安。',r:1},{t:'我觉得计划赶不上变化，随性一点更自在。',r:-1},{t:'我习惯提前完成任务，不喜欢踩着截止线交差。',r:1},{t:'面对多个选择时，我喜欢保留弹性，最后一刻再定。',r:-1},{t:'我的待办清单常常写得清清楚楚，完成一项划掉一项。',r:1},{t:'规则和流程对我来说更多是参考，必要时可以打破。',r:-1}]
};
var ROUND_ORDER=[['EI','SN','TF','JP'],['SN','JP','EI','TF'],['TF','EI','JP','SN'],['JP','TF','SN','EI']];
var QUESTIONS=[];
for(var ri=0;ri<10;ri++){var order=ROUND_ORDER[ri%ROUND_ORDER.length];for(var oi=0;oi<order.length;oi++){var dk=order[oi];var rq=RAW_QUESTIONS[dk][ri];QUESTIONS.push({t:rq.t,d:dk,r:rq.r});}}

var TYPES={
INTJ:{name:'建筑师',tag:'一切系统皆可优化的长远战略家',desc:'你习惯在脑中推演世界的运行规则，目光总落在长远处；独立、克制、目标感强，一旦想清楚就很难被动摇。',kw:['深谋远虑','独立','理性'],st:['战略思维强，善于制定并坚持长远规划','高度独立，不轻易被他人观点左右','冷静理性，压力之下思路依然清晰','对感兴趣的领域钻研得极深'],bl:['容易低估情感与人际因素的价值','对低效零容忍，可能显得不耐烦','追求完美，迟迟不肯迈出第一步','不轻易敞开心扉，关系易停留在浅层']},
INTP:{name:'逻辑学家',tag:'永远在追问「为什么」的思想者',desc:'你的大脑像一座不停运转的实验室，任何结论都要先过一遍逻辑检验；好奇心旺盛，纯粹地享受思考本身的乐趣。',kw:['逻辑严密','好奇心','思想开放'],st:['逻辑严密，擅长发现论证的漏洞与本质','好奇心强，知识面广泛','思想开放，愿意随时修正自己的观点','不迷信权威与惯例'],bl:['想得多做得少，行动力时常掉线','对细节和收尾工作缺乏耐心','容易陷入反复分析，迟迟无法决断','情绪表达含蓄，让人觉得难以走近']},
ENTJ:{name:'指挥官',tag:'天生的统筹者与推进器',desc:'你总能快速看清局面并果断出手，擅长调动资源、组织人手，带领大家一起朝目标直线推进。',kw:['果断','统筹力','执行力'],st:['决策果断，说到做到','战略与统筹能力出色','自信坚定，敢于承担风险','善于发现并使用人才'],bl:['强势直接，可能忽略他人感受','耐心有限，对低效容忍度低','习惯掌控，不放心放手给别人','容易把关系也变成待办任务']},

function computeResult(answers){
  var raw={EI:0,SN:0,TF:0,JP:0};
  for(var i=0;i<QUESTIONS.length;i++){
    var q=QUESTIONS[i];var v=(answers&&typeof answers[i]==='number')?answers[i]:0;raw[q.d]+=v*q.r;
  }
  var dims=DIMENSIONS.map(function(D){
    var r=raw[D.key];var tied=(r===0);
    var dominant=r>0?D.left:(r<0?D.right:D.left);
    var recessive=(dominant===D.left)?D.right:D.left;
    var pct=Math.round(((Math.abs(r)+20)/40)*100);
    var level=pct>=70?'显著':(pct>=60?'明显':(pct>=55?'轻微':'临界'));
    return{key:D.key,name:D.name,left:D.left,right:D.right,leftName:D.leftName,rightName:D.rightName,raw:r,dominant:dominant,recessive:recessive,domName:(dominant===D.left)?D.leftName:D.rightName,recName:(dominant===D.left)?D.rightName:D.leftName,pct:pct,tied:tied,level:level};
  });
  var code=dims.map(function(d){return d.dominant;}).join('');
  return{code:code,type:TYPES[code],dims:dims,anyTied:dims.some(function(d){return d.tied;})};
}

  appDoc=screen;appWin=window;
  // re-bind global functions for the iframe context
  window.appStart=appStart;window.appBack=appBack;window.appShare=appShare;window.appRestart=appRestart;window.closeShare=closeShare;
  showScreen('start');
}

function showScreen(name){
  var map={start:'screen-start',quiz:'screen-quiz',loading:'screen-loading',result:'screen-result'};
  Object.keys(map).forEach(function(k){
    var el=appDoc.querySelector('#'+map[k]);
    if(el)el.classList.remove('active');
  });
  if(map[name]){
    var el=appDoc.querySelector('#'+map[name]);
    if(el)el.classList.add('active');
  }
  updateProtoState(name);
}

function appStart(){
  appState.answers=new Array(QUESTIONS.length).fill(null);
  appState.cur=0;appState.locked=false;
  renderQuestion();
  showScreen('quiz');
}

function renderQuestion(){
  var q=QUESTIONS[appState.cur];
  appDoc.querySelector('#qc').textContent=(appState.cur+1)+' / '+QUESTIONS.length;
  appDoc.querySelector('#pf').style.width=Math.round((appState.cur+1)/QUESTIONS.length*100)+'%';
  var backBtn=appDoc.querySelector('.back-btn');
  if(backBtn)backBtn.style.visibility=appState.cur>0?'visible':'hidden';
  appDoc.querySelector('#qt').textContent=q.t;
  var html=SCALE.map(function(o,i){
    var dots=o.tone==='neutral'?'<span class="dash"></span>':'';
    if(o.tone!=='neutral'){for(var k=0;k<o.dots;k++)dots+='<span class="dot"></span>';}
    return '<button class="opt tone-'+o.tone+'" onclick="appSelect('+i+')"><span>'+o.label+'</span><span class="dots">'+dots+'</span></button>';
  }).join('');
  appDoc.querySelector('#opts').innerHTML=html;
  if(appState.answers[appState.cur]!==null&&appState.answers[appState.cur]!==undefined){
    var pi=SCALE.findIndex(function(o){return o.value===appState.answers[appState.cur];});
    if(pi>=0)appDoc.querySelector('#opts').children[pi].classList.add('sel');
  }
}

function appSelect(i){
  if(appState.locked)return;
  appState.locked=true;
  appState.answers[appState.cur]=SCALE[i].value;
  appDoc.querySelector('#opts').children[i].classList.add('sel');
  setTimeout(function(){
    appState.locked=false;
    if(appState.cur<QUESTIONS.length-1){appState.cur++;renderQuestion();}
    else{finish();}
  },280);
}

function appBack(){
  if(appState.cur>0&&!appState.locked){appState.cur--;renderQuestion();}
}

function finish(){
  showScreen('loading');
  var msgs=['正在分析你的能量来源…','正在解读你的认知偏好…','正在评估你的决策风格…','正在描绘你的性格画像…'];
  var mi=0;var lt=appDoc.querySelector('#lt');
  lt.textContent=msgs[0];
  clearInterval(appState.loadTimer);
  appState.loadTimer=setInterval(function(){mi=(mi+1)%msgs.length;lt.textContent=msgs[mi];},600);
  setTimeout(function(){clearInterval(appState.loadTimer);showResult();},2400);
}

function showResult(){
  var r=computeResult(appState.answers);
  appState.currentResult=r;
  appDoc.querySelector('#hc').textContent=r.code;
  appDoc.querySelector('#hn').textContent=r.type.name;
  appDoc.querySelector('#ht').textContent=r.type.tag;
  appDoc.querySelector('#hd').textContent=r.type.desc;
  appDoc.querySelector('#dl').innerHTML=r.dims.map(function(d){
    var badge=d.tied?'两极均衡':(d.level+'倾向');
    var crit=(d.tied||d.level==='临界');
    return '<div class="dim"><div class="dim-head"><span class="dim-title">'+d.name+'</span><span class="dim-badge'+(crit?' lv-crit':'')+'">'+badge+'</span></div><div class="dim-bar"><div class="dim-fill" style="width:0"></div></div><div class="dim-legend"><span><b>'+d.dominant+'</b> '+d.domName+' · '+d.pct+'%</span><span>'+(100-d.pct)+'% · '+d.recName+' <b>'+d.recessive+'</b></span></div></div>';
  }).join('');
  appDoc.querySelector('#tn').hidden=!r.anyTied;
  appDoc.querySelector('#sl').innerHTML=r.type.st.map(function(s){return '<div class="list-item">'+s+'</div>';}).join('');
  appDoc.querySelector('#bl').innerHTML=r.type.bl.map(function(s){return '<div class="list-item">'+s+'</div>';}).join('');
  showScreen('result');
  setTimeout(function(){
    appDoc.querySelectorAll('.dim-fill').forEach(function(el,i){el.style.width=r.dims[i].pct+'%';});
  },100);
}

function appShare(){
  var r=appState.currentResult;
  var html='<div class="sc-code">'+r.code+'</div><div class="sc-name">'+r.type.name+'</div><div class="sc-tag">'+r.type.tag+'</div><div class="sc-kws">'+r.type.kw.map(function(k){return '<span class="sc-kw">'+k+'</span>';}).join('')+'</div><div class="sc-foot">MBTI 性格测评 · 免费匿名 · 仅供娱乐参考</div>';
  if(!appDoc.querySelector('#share-modal')){
    var div=document.createElement('div');div.innerHTML=TPL_SHARE;appDoc.querySelector('#app').appendChild(div.firstChild);
  }
  appDoc.querySelector('#scp').innerHTML=html;
  appDoc.querySelector('#share-modal').classList.add('open');
  updateProtoState('share');
}

function closeShare(){
  var m=appDoc.querySelector('#share-modal');
  if(m)m.classList.remove('open');
  updateProtoState('result');
}

function appRestart(){
  appState.answers=null;appState.cur=0;appState.currentResult=null;
  showScreen('start');
}

/* =============== Prototype Controls =============== */
var annotationsOn=true;
var currentScreen='start';
var visitedScreens={start:true};

var SCREEN_INFO={
  start:{name:'开始页',fr:'FR-5',elements:[
    {c:'green',t:'产品标识（MBTI · 16型人格测评）'},
    {c:'green',t:'信息徽章（40题/约10分钟、免费无需注册、本地计分不上传）'},
    {c:'green',t:'开始测评按钮（主 CTA）'},
    {c:'amber',t:'免责声明（仅供娱乐参考，非心理诊断）'}
  ],interaction:'用户打开链接即进入此页面，点击「开始测评」进入答题页。无需注册，无网络请求。'},
  quiz:{name:'答题页',fr:'FR-1',elements:[
    {c:'blue',t:'进度条 + 题号（如 12 / 40）'},
    {c:'blue',t:'题目文本（居中卡片展示）'},
    {c:'blue',t:'5 级量表选项（非常同意 → 非常不同意）'},
    {c:'amber',t:'上一题按钮（非首题时可用，原答案保留）'}
  ],interaction:'选择后自动高亮并跳转下一题（约0.3秒延迟防误触）。40题交叉排列，每维度正反向各5题。支持回退修改。'},
  loading:{name:'分析页',fr:'FR-5',elements:[
    {c:'blue',t:'加载动画（旋转 spinner）'},
    {c:'blue',t:'4 条轮播文案（约2.4秒过渡）'}
  ],interaction:'第40题完成后自动进入。纯前端本地计分，无网络请求。2.4秒后自动跳转结果页。'},
  result:{name:'结果页',fr:'FR-3',elements:[
    {c:'green',t:'类型英雄区（4字母代码 + 中文名称 + 标语 + 简介）'},
    {c:'green',t:'维度倾向强度图表（4条条形图 + 百分比）'},
    {c:'amber',t:'临界提示（维度两极均衡时显示）'},
    {c:'green',t:'优势清单（4条）'},
    {c:'green',t:'潜在盲区清单（3-4条）'},
    {c:'blue',t:'生成分享卡片 / 重新测试 按钮'},
    {c:'amber',t:'免责声明'}
  ],interaction:'核心结果展示页。计分逻辑：pct = (|raw|+20)/40*100%，范围[50,100]。强度分级：显著/明显/轻微/临界。展示用户完整性格画像。'},
  share:{name:'分享弹层',fr:'FR-4',elements:[
    {c:'green',t:'卡片预览（类型代码 + 名称 + 标语 + 关键词胶囊）'},
    {c:'blue',t:'长按保存提示'},
    {c:'blue',t:'保存图片 / 关闭 按钮'}
  ],interaction:'Canvas本地绘制1080x1440卡片。微信内长按保存，其余浏览器点击下载。卡片携带入口链接承接新流量。'}
};

function updateProtoState(screen){
  currentScreen=screen;
  visitedScreens[screen]=true;
  // update nav
  var steps=document.querySelectorAll('.nav-step');
  steps.forEach(function(s){
    var sn=s.getAttribute('data-screen');
    s.classList.remove('active','done');
    if(visitedScreens[sn]&&sn!==screen)s.classList.add('done');
    if(sn===screen)s.classList.add('active');
  });
  // update badge
  document.getElementById('screen-badge').textContent=SCREEN_INFO[screen]?SCREEN_INFO[screen].name:screen;
  // update annotation panel
  updateAnnoPanel(screen);
  // update annotation badges
  updateAnnoBadges(screen);
}

function updateAnnoPanel(screen){
  var info=SCREEN_INFO[screen];
  if(!info)return;
  var elList=info.elements.map(function(e){
    return '<li class="'+e.c+'">'+e.t+'</li>';
  }).join('');
  document.getElementById('anno-panel').innerHTML=`
    <div class="anno-card">
      <div class="anno-card-title">当前页面</div>
      <div class="anno-screen-name">${info.name}</div>
      <span class="anno-screen-fr">${info.fr}</span>
    </div>
    <div class="anno-card">
      <div class="anno-card-title">核心元素</div>
      <ul class="anno-elements">${elList}</ul>
    </div>
    <div class="anno-card">
      <div class="anno-card-title">交互说明</div>
      <div class="anno-interaction">${info.interaction}</div>
    </div>
    <div class="anno-card">
      <div class="anno-card-title">完整流程</div>
      <div class="anno-flow-mini">
        ${['start','quiz','loading','result','share'].map(function(s){
          var cls=s===screen?'current':(visitedScreens[s]?'done':'');
          return '<div class="anno-flow-step '+cls+'"><div class="dot"></div>'+SCREEN_INFO[s].name+'</div>';
        }).join('')}
      </div>
    </div>
  `;
}

function toggleAnnotations(){
  annotationsOn=!annotationsOn;
  document.getElementById('btn-anno').classList.toggle('active',annotationsOn);
  document.querySelector('.anno-panel').style.display=annotationsOn?'block':'none';
  updateAnnoBadges(currentScreen);
}

function jumpTo(screen){
  if(screen==='start'){showScreen('start');}
  else if(screen==='quiz'){if(!appState.answers)appStart();else showScreen('quiz');}
  else if(screen==='loading'){showScreen('loading');}
  else if(screen==='result'){skipToResult();}
  else if(screen==='share'){if(appState.currentResult)appShare();else{skipToResult();setTimeout(function(){appShare();},200);}}
}

function skipToResult(){
  // pre-fill with INTP-favoring answers
  var want={EI:'I',SN:'N',TF:'T',JP:'P'};
  appState.answers=QUESTIONS.map(function(q){
    var D=DIMENSIONS.filter(function(d){return d.key===q.d;})[0];
    var dirLetter=q.r===1?D.left:D.right;
    return dirLetter===want[q.d]?2:-2;
  });
  showResult();
}

function resetProto(){
  appState.answers=null;appState.cur=0;appState.currentResult=null;
  visitedScreens={start:true};
  var m=appDoc.querySelector('#share-modal');
  if(m)m.classList.remove('open');
  showScreen('start');
}

function updateAnnoBadges(screen){
  var badges=[document.getElementById('anno-1'),document.getElementById('anno-2'),document.getElementById('anno-3')];
  badges.forEach(function(b){b.classList.remove('visible');b.textContent='';});
  if(!annotationsOn)return;
  var annotations={
    start:[
      {sel:'.hero-badge',text:'产品标识',dir:'left'},
      {sel:'.chips',text:'信息徽章：免费/匿名/无上传',dir:'left'},
      {sel:'.btn-primary',text:'主CTA：开始测评',dir:'right'}
    ],
    quiz:[
      {sel:'.progress',text:'进度条 FR-1',dir:'left'},
      {sel:'.q-card',text:'题目文本',dir:'left'},
      {sel:'.opt:first-child',text:'5级量表',dir:'right'}
    ],
    loading:[
      {sel:'.spinner',text:'加载动画',dir:'right'}
    ],
    result:[
      {sel:'.result-hero',text:'类型英雄区 FR-3',dir:'right'},
      {sel:'.dim-bar',text:'维度倾向图表',dir:'left'},
      {sel:'.result-actions .btn-primary',text:'生成分享卡片 FR-4',dir:'right'}
    ],
    share:[
      {sel:'.share-card-preview',text:'卡片预览 FR-4',dir:'right'}
    ]
  };
  var anns=annotations[screen]||[];
  anns.forEach(function(a,i){
    if(i>=3)return;
    var badge=badges[i];if(!badge)return;
    var el=appDoc.querySelector(a.sel);if(!el)return;
    badge.textContent=a.text;
    badge.className='anno-badge visible arrow-'+a.dir;
    // position badge relative to phone frame
    setTimeout(function(){
      var phoneRect=document.querySelector('.phone-frame').getBoundingClientRect();
      var elRect=el.getBoundingClientRect();
      var badgeW=badge.offsetWidth||120;
      var badgeH=badge.offsetHeight||22;
      if(a.dir==='left'){
        badge.style.left=(elRect.left-phoneRect.left-badgeW-14)+'px';
        badge.style.top=(elRect.top-phoneRect.top+elRect.height/2-badgeH/2)+'px';
      }else if(a.dir==='right'){
        badge.style.left=(elRect.right-phoneRect.left+14)+'px';
        badge.style.top=(elRect.top-phoneRect.top+elRect.height/2-badgeH/2)+'px';
      }else{
        badge.style.left=(elRect.left-phoneRect.left+elRect.width/2-badgeW/2)+'px';
        badge.style.top=(elRect.top-phoneRect.top-badgeH-14)+'px';
      }
    },50);
  });
}

/* =============== Init =============== */
initApp();
</script>
