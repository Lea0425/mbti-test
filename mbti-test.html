<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="20 题免费匿名 MBTI 性格测评，约 5 分钟，四维度分析，揭示你的 16 型人格。">
<title>MBTI 性格测评 · 发现你的 16 型人格</title>
<style>
:root{
  --c-bg:#F5F6FB;--c-ink:#221E35;--c-sub:#6E7284;--c-line:#E7E8F0;
  --c-primary:#6366F1;--c-violet:#8B5CF6;--c-pink:#EC4899;--c-amber:#D97706;
  --grad:linear-gradient(135deg,#6366F1,#8B5CF6 55%,#EC4899);
  --shadow:0 8px 28px rgba(70,60,140,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--c-bg);color:var(--c-ink);-webkit-font-smoothing:antialiased;
  min-height:100vh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(420px 320px at 88% -6%,rgba(139,92,246,.14),transparent 65%),
  radial-gradient(380px 300px at -12% 30%,rgba(99,102,241,.10),transparent 65%),
  radial-gradient(420px 340px at 80% 108%,rgba(236,72,153,.10),transparent 65%);
}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:26px 22px calc(30px + env(safe-area-inset-bottom,0px));min-height:100vh}
.screen{display:none;animation:fadeIn .3s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border:none;border-radius:16px;font-size:17px;font-weight:600;cursor:pointer;transition:transform .12s,opacity .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 12px 26px rgba(124,58,237,.30)}
.btn-ghost{background:#fff;border:1.5px solid var(--c-line);color:var(--c-sub)}
.btn:disabled{opacity:.42;pointer-events:none}
.btn-lg{height:58px;font-size:18px}

/* ---- start ---- */
.start-wrap{padding-top:8vh}
.hero-badge{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:1px;color:var(--c-primary);background:#fff;border:1px solid #E4E6F7;border-radius:99px;padding:7px 14px;box-shadow:var(--shadow)}
h1{font-size:44px;font-weight:800;line-height:1.22;margin:22px 0 16px}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.start-sub{font-size:15.5px;line-height:1.75;color:var(--c-sub)}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0 30px}
.chip{font-size:12.5px;color:#5A5F75;background:#fff;border:1px solid var(--c-line);border-radius:99px;padding:6px 12px}
.start-note{margin-top:14px;font-size:13px;color:#9AA0B4;text-align:center}
.disclaimer{margin-top:26px;font-size:12px;line-height:1.7;color:#A3A8BC;text-align:center}

/* ---- quiz ---- */
.quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.progress{flex:1;height:6px;background:#E9EAF4;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .35s ease}
.q-count{flex:none;font-size:12.5px;color:var(--c-sub);font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.q-card{background:#fff;border-radius:24px;padding:34px 24px;min-height:140px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);margin-bottom:18px}
.q-card.q-anim{animation:fadeUp .26s ease}
.q-text{font-size:21px;font-weight:600;line-height:1.6;text-align:center}
.options{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.opt{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--c-line);border-radius:16px;padding:18px 18px;font-size:16.5px;color:#33304A;cursor:pointer;transition:border-color .15s,background .15s,transform .12s;text-align:left;line-height:1.5}
.opt:active{transform:scale(.985)}
.opt-letter{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--c-line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--c-sub);transition:all .15s}
.opt.sel{border-color:var(--c-primary);background:#EEF0FF}
.opt.sel .opt-letter{background:var(--grad);color:#fff;border-color:transparent}
.opt>span:last-child{flex:1}
.quiz-nav{display:flex;gap:12px}
.quiz-nav .btn{flex:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ---- loading ---- */
.load-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh}
.spinner{width:52px;height:52px;border-radius:50%;border:4px solid #E3E4F2;border-top-color:var(--c-violet);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{margin-top:20px;font-size:15px;color:var(--c-sub)}

/* ---- result ---- */
.result-hero{position:relative;overflow:hidden;background:var(--grad);color:#fff;border-radius:26px;padding:36px 26px 30px;text-align:center;box-shadow:0 16px 40px rgba(124,58,237,.32)}
.result-hero::before,.result-hero::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.result-hero::before{width:220px;height:220px;top:-90px;right:-60px}
.result-hero::after{width:150px;height:150px;bottom:-70px;left:-40px}
.hero-label{font-size:13px;letter-spacing:5px;opacity:.8}
.hero-code{font-size:60px;font-weight:800;letter-spacing:7px;margin:12px 0 4px;text-shadow:0 6px 24px rgba(0,0,0,.18)}
.hero-name{font-size:24px;font-weight:700}
.hero-tag{margin-top:12px;font-size:14.5px;font-weight:600;opacity:.95}
.hero-desc{margin-top:10px;font-size:13.5px;line-height:1.75;opacity:.88}
.section-title{font-size:17px;font-weight:700;margin:26px 0 14px}
.dim-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.dim-grid{grid-template-columns:1fr}}
.dim-card{background:#fff;border-radius:16px;padding:18px 16px;box-shadow:var(--shadow)}
.dim-card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dim-letter{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex:none}
.dim-info{flex:1;min-width:0}
.dim-cn{font-size:15px;font-weight:700;line-height:1.3}
.dim-en{font-size:11px;color:var(--c-sub);letter-spacing:.5px}
.dim-desc{font-size:12.5px;line-height:1.65;color:#4A4866}
.dim-bar{height:6px;background:#EEF0F6;border-radius:99px;overflow:hidden;margin-top:10px}
.dim-bar-fill{height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .8s ease}
.dim-pct{font-size:11.5px;color:var(--c-sub);margin-top:6px}
.traits-card{background:#fff;border-radius:22px;padding:22px 20px;box-shadow:var(--shadow)}
.trait-item{position:relative;padding:10px 0 10px 22px;font-size:15px;line-height:1.6;color:#3C3A55;border-bottom:1px solid #F3F4FA}
.trait-item:last-child{border-bottom:none}
.trait-item::before{content:'';position:absolute;left:2px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--grad)}
.result-actions{margin-top:24px;display:flex;flex-direction:column;gap:12px}
.result-disclaimer{margin-top:26px;background:#FFF8EC;border:1px solid #FDE68A;border-radius:14px;padding:16px 18px;font-size:13px;line-height:1.75;color:#92710C;text-align:center}
</style>
</head>
<body>
<div id="app">

  <!-- 开始页 -->
  <section id="screen-start" class="screen active">
    <div class="start-wrap">
      <div class="hero-badge">MBTI · 16 型人格测评</div>

    <h3 class="section-title">你的四个维度</h3>
    <div class="dim-grid" id="dim-grid"></div>
    <h3 class="section-title">类型特点</h3>
    <div class="traits-card" id="traits"></div>
    <div class="result-actions">
      <button class="btn btn-ghost" id="btn-restart">重新测试</button>
    </div>
    <div class="result-disclaimer">本测评仅供娱乐和自我了解，不构成心理诊断或专业建议。MBTI 是一种人格类型框架，并非精确的科学测量工具。如有需要，请咨询专业心理咨询师。</div>

</div>

ESFP:{name:'表演者',tag:'走到哪都是焦点的开心果',desc:'你热情外放、感染力十足，哪里有你哪里就有笑声。',traits:['感染力强，乐观开朗','善于享受当下','慷慨热情']}
};

/* =============== 计分逻辑 =============== */
function computeResult(answers){
  var raw={EI:0,SN:0,TF:0,JP:0};
  for(var i=0;i<QUESTIONS.length;i++){
    var q=QUESTIONS[i];
    var v=(answers[i]!==null&&answers[i]!==undefined)?answers[i]:0;
    raw[q.d]+=v;
  }
  var dims=DIMENSIONS.map(function(D){
    var r=raw[D.key];
    var tied=(r===0);
    var dominant=r>0?D.left:(r<0?D.right:D.left);
    var recessive=(dominant===D.left)?D.right:D.left;
    var pct=Math.round(((Math.abs(r)+5)/10)*100);
    return{
      key:D.key,name:D.name,
      letter:dominant,
      letterName:(dominant===D.left)?D.leftName:D.rightName,
      letterEn:(dominant===D.left)?D.leftEn:D.rightEn,
      desc:(dominant===D.left)?D.leftDesc:D.rightDesc,
      pct:pct,tied:tied,
      otherLetter:recessive,
      otherPct:100-pct
    };
  });
  var code=dims.map(function(d){return d.letter;}).join('');
  return{code:code,type:TYPES[code],dims:dims};
}

/* =============== UI 逻辑 =============== */
var $=function(id){return document.getElementById(id);};
var answers,currentQ,loadTimer;

function show(id){
  ['screen-start','screen-quiz','screen-loading','screen-result'].forEach(function(s){
    $(s).classList.toggle('active',s===id);
  });
  window.scrollTo(0,0);
}

function startQuiz(){
  answers=new Array(QUESTIONS.length).fill(null);
  currentQ=0;
  renderQuestion();
  show('screen-quiz');
}

function renderQuestion(){
  var q=QUESTIONS[currentQ];
  $('qc').textContent=(currentQ+1)+' / '+QUESTIONS.length;
  $('pf').style.width=Math.round((currentQ+1)/QUESTIONS.length*100)+'%';
  $('qt').textContent=q.t;
  /* options */
  var optsHTML=
    '<button class="opt" data-v="'+q.a.v+'"><span class="opt-letter">A</span><span>'+q.a.t+'</span></button>'+
    '<button class="opt" data-v="'+q.b.v+'"><span class="opt-letter">B</span><span>'+q.b.t+'</span></button>';
  $('opts').innerHTML=optsHTML;
  Array.prototype.forEach.call($('opts').children,function(btn){
    btn.addEventListener('click',function(){selectOpt(btn);});
  });
  /* restore previous selection */
  if(answers[currentQ]!==null&&answers[currentQ]!==undefined){
    Array.prototype.forEach.call($('opts').children,function(btn){
      if(+btn.getAttribute('data-v')===answers[currentQ])btn.classList.add('sel');
    });
    $('btn-next').disabled=false;
  }else{
    $('btn-next').disabled=true;
  }
  /* nav buttons */
  $('btn-prev').disabled=(currentQ===0);
  $('btn-next').textContent=(currentQ===QUESTIONS.length-1)?'查看结果':'下一题';
  /* animation */
  var card=$('qcard');
  card.classList.remove('q-anim');
  void card.offsetWidth;
  card.classList.add('q-anim');
}

function selectOpt(btn){
  var v=+btn.getAttribute('data-v');
  answers[currentQ]=v;
  Array.prototype.forEach.call($('opts').children,function(b){b.classList.remove('sel');});
  btn.classList.add('sel');
  $('btn-next').disabled=false;
  if(navigator.vibrate){try{navigator.vibrate(8);}catch(e){}}
}

function next(){
  if(answers[currentQ]===null||answers[currentQ]===undefined)return;
  if(currentQ<QUESTIONS.length-1){
    currentQ++;
    renderQuestion();
  }else{
    finish();
  }
}

function prev(){
  if(currentQ>0){
    currentQ--;
    renderQuestion();
  }
}

function finish(){
  show('screen-loading');
  var msgs=['正在分析你的性格…','正在解读你的维度倾向…','正在匹配你的人格类型…'];
  var mi=0;
  $('lt').textContent=msgs[0];
  clearInterval(loadTimer);
  loadTimer=setInterval(function(){mi=(mi+1)%msgs.length;$('lt').textContent=msgs[mi];},600);
  setTimeout(function(){
    clearInterval(loadTimer);
    showResult();
  },1800);
}

function showResult(){
  var r=computeResult(answers);
  $('hc').textContent=r.code;
  $('hn').textContent=r.type.name;
  $('ht').textContent=r.type.tag;
  $('hd').textContent=r.type.desc;
  /* 四维度卡片 */
  $('dim-grid').innerHTML=r.dims.map(function(d){
    return '<div class="dim-card">'+
      '<div class="dim-card-top">'+
        '<div class="dim-letter">'+d.letter+'</div>'+
        '<div class="dim-info"><div class="dim-cn">'+d.letterName+'</div><div class="dim-en">'+d.letterEn+'</div></div>'+
      '</div>'+
      '<div class="dim-desc">'+d.desc+'</div>'+
      '<div class="dim-bar"><div class="dim-bar-fill" style="width:0"></div></div>'+
      '<div class="dim-pct">'+d.letter+' '+d.pct+'%  ·  '+d.otherLetter+' '+d.otherPct+'%'+(d.tied?'  ·  两极均衡':'')+'</div>'+
    '</div>';
  }).join('');
  /* 类型特点 */
  $('traits').innerHTML=r.type.traits.map(function(t){
    return '<div class="trait-item">'+t+'</div>';
  }).join('');
  show('screen-result');
  /* 动画填充进度条 */
  setTimeout(function(){
    Array.prototype.forEach.call(document.querySelectorAll('.dim-bar-fill'),function(el,i){
      el.style.width=r.dims[i].pct+'%';
    });
  },200);
}

function restart(){
  answers=null;currentQ=0;
  clearInterval(loadTimer);
  show('screen-start');
}

/* 事件绑定 */
$('btn-start').addEventListener('click',startQuiz);
$('btn-prev').addEventListener('click',prev);
$('btn-next').addEventListener('click',next);
$('btn-restart').addEventListener('click',restart);
</script>
